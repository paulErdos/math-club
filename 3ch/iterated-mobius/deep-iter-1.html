<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Iterated Möbius Transform Visualizer</title>
    <style>
        * {
            user-select: none;
        }
        body {
            background: #0a0c12;
            font-family: 'Segoe UI', 'Monaco', 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #11131f;
            border-radius: 28px;
            padding: 20px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
            border: 1px solid #2a2e44;
        }
        .canvas-panel {
            display: flex;
            justify-content: center;
        }
        canvas {
            background: #03050a;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            display: block;
            border: 1px solid #2f354c;
            cursor: crosshair;
        }
        .controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: space-between;
        }
        .param-grid {
            background: #0f111c;
            border-radius: 20px;
            padding: 12px 18px;
            flex: 2;
            min-width: 260px;
            border: 1px solid #262c42;
        }
        .param-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
            align-items: center;
        }
        .param-row label {
            color: #b9c7ff;
            font-weight: 600;
            font-size: 0.8rem;
            width: 50px;
        }
        input[type="range"] {
            flex: 1;
            min-width: 120px;
            background: #1e2237;
            height: 3px;
            border-radius: 4px;
            -webkit-appearance: none;
        }
        input[type="range"]:focus {
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #7c93ff;
            cursor: pointer;
            box-shadow: 0 0 4px #9bb2ff;
        }
        .param-value {
            background: #01010c;
            color: #adc8ff;
            font-family: monospace;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
            width: 55px;
            text-align: center;
            border: 1px solid #2c3150;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        button {
            background: #1e243f;
            border: none;
            color: white;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-family: monospace;
            cursor: pointer;
            transition: all 0.1s ease;
            box-shadow: 0 1px 2px black;
            border-bottom: 1px solid #2f3a60;
        }
        button:active {
            transform: scale(0.96);
            background: #2c345a;
        }
        .danger-btn {
            background: #3a1f2c;
            border-bottom-color: #b44;
        }
        .primary-btn {
            background: #2b4680;
            border-bottom-color: #7c9eff;
        }
        select {
            background: #12162b;
            color: #d9e2ff;
            border: 1px solid #2d3470;
            border-radius: 24px;
            padding: 6px 12px;
            font-family: monospace;
            font-weight: bold;
        }
        .status {
            color: #6e85c2;
            font-size: 0.7rem;
            font-family: monospace;
            margin-top: 8px;
            text-align: center;
        }
        h3 {
            margin: 0 0 8px 0;
            font-size: 0.9rem;
            color: #cfdcff;
            letter-spacing: 1px;
        }
        hr {
            border-color: #262e4a;
            margin: 12px 0;
        }
        .seed-control {
            flex: 1;
            min-width: 200px;
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="canvas-panel">
        <canvas id="mobiusCanvas" width="700" height="700" style="width:700px;height:700px"></canvas>
    </div>

    <div class="controls">
        <!-- LEFT: Möbius parameters & type -->
        <div class="param-grid">
            <h3>⚡ MÖBIUS MATRIX (a,b,c,d)</h3>
            <div class="param-row">
                <label>a_real</label><input type="range" id="a_re" min="-2.5" max="2.5" step="0.01" value="1.2"><span id="a_re_val" class="param-value">1.20</span>
                <label>a_imag</label><input type="range" id="a_im" min="-2" max="2" step="0.01" value="0"><span id="a_im_val" class="param-value">0.00</span>
            </div>
            <div class="param-row">
                <label>b_real</label><input type="range" id="b_re" min="-2.5" max="2.5" step="0.01" value="0.5"><span id="b_re_val" class="param-value">0.50</span>
                <label>b_imag</label><input type="range" id="b_im" min="-2" max="2" step="0.01" value="0.3"><span id="b_im_val" class="param-value">0.30</span>
            </div>
            <div class="param-row">
                <label>c_real</label><input type="range" id="c_re" min="-2" max="2" step="0.01" value="0"><span id="c_re_val" class="param-value">0.00</span>
                <label>c_imag</label><input type="range" id="c_im" min="-2" max="2" step="0.01" value="0"><span id="c_im_val" class="param-value">0.00</span>
            </div>
            <div class="param-row">
                <label>d_real</label><input type="range" id="d_re" min="-2.5" max="2.5" step="0.01" value="0.8"><span id="d_re_val" class="param-value">0.80</span>
                <label>d_imag</label><input type="range" id="d_im" min="-2" max="2" step="0.01" value="0"><span id="d_im_val" class="param-value">0.00</span>
            </div>
            <div class="param-row">
                <label>TYPE</label>
                <select id="transformType">
                    <option value="custom">CUSTOM (matrix)</option>
                    <option value="hyperbolic">HYPERBOLIC (k=2.8, fix ±1)</option>
                    <option value="elliptic">ELLIPTIC (θ=π/7, fix ±0.8j)</option>
                    <option value="loxodromic">LOXODROMIC (k=1.35, θ=π/7)</option>
                </select>
                <button id="applyTypeBtn" class="primary-btn">APPLY PRESET</button>
            </div>
            <div class="param-row">
                <label>ITER</label><input type="range" id="iterCount" min="1" max="6" step="1" value="3"><span id="iterVal" class="param-value">3</span>
                <label>FADE</label><input type="range" id="alphaMin" min="0.05" max="0.9" step="0.01" value="0.18"><span id="alphaMinVal" class="param-value">0.18</span>
            </div>
        </div>

        <!-- RIGHT: animation + seed controls -->
        <div class="param-grid seed-control">
            <h3>🎮 ANIMATION & SEEDS</h3>
            <div class="param-row">
                <label>▶ SPEED</label><input type="range" id="deltaMs" min="30" max="800" step="10" value="180"><span id="deltaVal" class="param-value">180ms</span>
                <button id="playBtn" class="primary-btn">▶ PLAY</button>
                <button id="stepBtn">⏯ STEP</button>
            </div>
            <div class="button-group">
                <button id="resetCanvasBtn" class="danger-btn">🗑 RESET CANVAS</button>
                <button id="clearSeedsBtn">❌ CLEAR SEEDS</button>
                <button id="defaultSeedsBtn">✨ DEFAULT SEEDS</button>
            </div>
            <div class="status" id="statusMsg">● READY | click canvas: ADD CIRCLE (center)</div>
            <hr>
            <div class="flex-col">
                <span style="color:#d0deff; font-size:0.7rem;">🎯 SEED CIRCLES (center, radius)</span>
                <div id="seedList" style="max-height:130px; overflow-y:auto; font-size:11px; background:#080b14; border-radius:16px; padding:5px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    (function(){
        // ---------- math utilities ----------
        function complexMul(z1, z2) { return {re: z1.re*z2.re - z1.im*z2.im, im: z1.re*z2.im + z1.im*z2.re}; }
        function complexAdd(z1, z2) { return {re: z1.re+z2.re, im: z1.im+z2.im}; }
        function complexSub(z1,z2) { return {re: z1.re-z2.re, im: z1.im-z2.im}; }
        function complexDiv(z1, z2) {
            let denom = z2.re*z2.re + z2.im*z2.im;
            if(denom === 0) return {re: Infinity, im: Infinity};
            return {re: (z1.re*z2.re + z1.im*z2.im)/denom, im: (z1.im*z2.re - z1.re*z2.im)/denom};
        }
        function complexAbs2(z) { return z.re*z.re + z.im*z.im; }
        function complexAbs(z) { return Math.hypot(z.re, z.im); }
        function complexExpI(theta) { return {re: Math.cos(theta), im: Math.sin(theta)}; }
        function conj(z) { return {re: z.re, im: -z.im}; }

        // apply mobius f(z) = (a*z + b)/(c*z + d)
        function mobiusMap(z, a,b,c,d) {
            let az = complexMul(a, z);
            let num = complexAdd(az, b);
            let cz = complexMul(c, z);
            let den = complexAdd(cz, d);
            return complexDiv(num, den);
        }

        // circle from three points (circumcenter)
        function circleFromThree(p1,p2,p3) {
            const x1=p1.re, y1=p1.im, x2=p2.re, y2=p2.im, x3=p3.re, y3=p3.im;
            const D = 2.0 * (x1*(y2 - y3) + x2*(y3 - y1) + x3*(y1 - y2));
            if(Math.abs(D) < 1e-12) return null;
            const r1sq = x1*x1 + y1*y1;
            const r2sq = x2*x2 + y2*y2;
            const r3sq = x3*x3 + y3*y3;
            const ux = (r1sq*(y2 - y3) + r2sq*(y3 - y1) + r3sq*(y1 - y2)) / D;
            const uy = (r1sq*(x3 - x2) + r2sq*(x1 - x3) + r3sq*(x2 - x1)) / D;
            const center = {re: ux, im: uy};
            const radius = Math.hypot(center.re - x1, center.im - y1);
            return {center, radius};
        }

        // transform circle via mobius (3-point sampling with pole avoidance)
        function transformCircle(circle, a,b,c,d) {
            let {center, radius} = circle;
            const baseAngle = Math.PI/12;
            let angles = [baseAngle, baseAngle + 2*Math.PI/3, baseAngle + 4*Math.PI/3];
            let pts = angles.map(ang => {
                return {re: center.re + radius*Math.cos(ang), im: center.im + radius*Math.sin(ang)};
            });
            // pole detection
            let pole = null;
            if(Math.hypot(c.re, c.im) > 1e-12) {
                let d_val = {re: d.re, im: d.im};
                let cneg = {re: -c.re, im: -c.im};
                pole = complexDiv(d_val, cneg);
            }
            if(pole && isFinite(pole.re)) {
                for(let i=0;i<pts.length;i++) {
                    let dz = Math.hypot(pts[i].re - pole.re, pts[i].im - pole.im);
                    if(dz < radius * 0.08) {
                        angles[i] += Math.PI/5;
                        pts[i] = {re: center.re + radius*Math.cos(angles[i]), im: center.im + radius*Math.sin(angles[i])};
                    }
                }
            }
            let mapped = pts.map(p => mobiusMap(p, a,b,c,d));
            if(!mapped.every(p => isFinite(p.re) && isFinite(p.im))) return null;
            const newCirc = circleFromThree(mapped[0], mapped[1], mapped[2]);
            if(!newCirc) return null;
            if(!isFinite(newCirc.radius) || newCirc.radius > 1e5 || newCirc.radius < 1e-12) return null;
            return newCirc;
        }

        function mobiusInverse(a,b,c,d) {
            let det_re = a.re*d.re - a.im*d.im - (b.re*c.re - b.im*c.im);
            let det_im = a.re*d.im + a.im*d.re - (b.re*c.im + b.im*c.re);
            let det2 = det_re*det_re + det_im*det_im;
            if(det2 === 0) return {a:{re:1,im:0}, b:{re:0,im:0}, c:{re:0,im:0}, d:{re:1,im:0}};
            let a_inv = {re: d.re/det2, im: -d.im/det2};
            let b_inv = {re: -b.re/det2, im: b.im/det2};
            let c_inv = {re: -c.re/det2, im: c.im/det2};
            let d_inv = {re: a.re/det2, im: -a.im/det2};
            return {a:a_inv, b:b_inv, c:c_inv, d:d_inv};
        }

        // ----- hyperbolic / elliptic / loxodromic presets (conjugate fixed points)
        function conjugatePreset(M0_base, p, q) {
            // S(z) = (q*z + p)/(z+1) maps 0->p , inf->q
            let S = {a: q, b: p, c: {re:1,im:0}, d: {re:1,im:0}};
            let S_inv = mobiusInverse(S.a, S.b, S.c, S.d);
            let M_res = composeMobius( composeMobius(S.a,S.b,S.c,S.d, M0_base.a,M0_base.b,M0_base.c,M0_base.d), S_inv.a,S_inv.b,S_inv.c,S_inv.d);
            return M_res;
        }
        function composeMobius(a1,b1,c1,d1, a2,b2,c2,d2) {
            // (a1,b1;c1,d1) o (a2,b2;c2,d2)
            let a = complexAdd(complexMul(a1,a2), complexMul(b1,c2));
            let b = complexAdd(complexMul(a1,b2), complexMul(b1,d2));
            let c = complexAdd(complexMul(c1,a2), complexMul(d1,c2));
            let d = complexAdd(complexMul(c1,b2), complexMul(d1,d2));
            return {a,b,c,d};
        }
        function getHyperbolicPreset() {
            let k = 2.8;
            let M0 = {a:{re:k,im:0}, b:{re:0,im:0}, c:{re:0,im:0}, d:{re:1,im:0}};
            let p = {re:-1,im:0}, q = {re:1,im:0};
            return conjugatePreset(M0, p, q);
        }
        function getEllipticPreset() {
            let theta = Math.PI/7;
            let M0 = {a:complexExpI(theta), b:{re:0,im:0}, c:{re:0,im:0}, d:{re:1,im:0}};
            let p = {re:0,im:-0.8}, q = {re:0,im:0.8};
            return conjugatePreset(M0, p, q);
        }
        function getLoxodromicPreset() {
            let k = 1.35;
            let theta = Math.PI/7;
            let mult = {re: k * Math.cos(theta), im: k * Math.sin(theta)};
            let M0 = {a:mult, b:{re:0,im:0}, c:{re:0,im:0}, d:{re:1,im:0}};
            let p = {re:-0.5, im:-0.5}, q = {re:0.8, im:0.6};
            return conjugatePreset(M0, p, q);
        }

        // Global state
        let canvas = document.getElementById('mobiusCanvas');
        let ctx = canvas.getContext('2d');
        let width = 700, height = 700;
        let xlim = [-3.2, 3.2];
        let ylim = [-3.2, 3.2];

        // current mobius matrix
        let mobius = {
            a: {re: 1.2, im: 0},
            b: {re: 0.5, im: 0.3},
            c: {re: 0, im: 0},
            d: {re: 0.8, im: 0}
        };
        let seeds = [
            {center: {re: 0.3, im: 0.3}, radius: 0.25},
            {center: {re: -0.5, im: 0.8}, radius: 0.2},
            {center: {re: 1.0, im: -0.3}, radius: 0.3},
            {center: {re: -0.2, im: -0.6}, radius: 0.22}
        ];
        let n_iter = 3;
        let alphaMin = 0.18;
        let fwdColor = "#4d7eff";
        let bwdColor = "#fdbe5c";
        let seedColor = "#f2f2f2";
        let lineWidth = 1.1;

        let animationId = null;
        let playing = false;
        let currentIterFrame = 0;   // 0 = draw seeds, 1=first iteration etc but we draw all iterations each frame, no stepping gradually? Actually we implement "step" to redraw with +1 accumulated iteration? Wait: interactive: each step increments iteration count? Better: we just redraw full orbits each frame using current iteration count. step button redraws same iter but can inc iteration? No — step: advance one extra iteration, keep iter limit. Let's make step increase n_iter by 1 up to max 10, then play and reset can reset iter to slider. Simpler: Step: if paused, increment n_iter (capped) and redraw. Play: auto increments iter progressively. Reset: reset n_iter to slider value.
        let maxIterLimit = 8;
        
        function updateMatrixFromSliders() {
            mobius.a = {re: parseFloat(document.getElementById('a_re').value), im: parseFloat(document.getElementById('a_im').value)};
            mobius.b = {re: parseFloat(document.getElementById('b_re').value), im: parseFloat(document.getElementById('b_im').value)};
            mobius.c = {re: parseFloat(document.getElementById('c_re').value), im: parseFloat(document.getElementById('c_im').value)};
            mobius.d = {re: parseFloat(document.getElementById('d_re').value), im: parseFloat(document.getElementById('d_im').value)};
            document.getElementById('a_re_val').innerText = mobius.a.re.toFixed(2);
            document.getElementById('a_im_val').innerText = mobius.a.im.toFixed(2);
            document.getElementById('b_re_val').innerText = mobius.b.re.toFixed(2);
            document.getElementById('b_im_val').innerText = mobius.b.im.toFixed(2);
            document.getElementById('c_re_val').innerText = mobius.c.re.toFixed(2);
            document.getElementById('c_im_val').innerText = mobius.c.im.toFixed(2);
            document.getElementById('d_re_val').innerText = mobius.d.re.toFixed(2);
            document.getElementById('d_im_val').innerText = mobius.d.im.toFixed(2);
        }
        function syncSlidersFromMatrix() {
            document.getElementById('a_re').value = mobius.a.re;
            document.getElementById('a_im').value = mobius.a.im;
            document.getElementById('b_re').value = mobius.b.re;
            document.getElementById('b_im').value = mobius.b.im;
            document.getElementById('c_re').value = mobius.c.re;
            document.getElementById('c_im').value = mobius.c.im;
            document.getElementById('d_re').value = mobius.d.re;
            document.getElementById('d_im').value = mobius.d.im;
            updateMatrixFromSliders();
        }
        
        function applyPreset(type) {
            if(type === 'hyperbolic') {
                let M = getHyperbolicPreset();
                mobius = M;
            } else if(type === 'elliptic') {
                mobius = getEllipticPreset();
            } else if(type === 'loxodromic') {
                mobius = getLoxodromicPreset();
            } else {
                return;
            }
            syncSlidersFromMatrix();
            redrawFull();
        }
        
        // drawing helpers
        function worldToCanvas(p) {
            let x = (p.re - xlim[0]) / (xlim[1] - xlim[0]) * width;
            let y = height - (p.im - ylim[0]) / (ylim[1] - ylim[0]) * height;
            return {x, y};
        }
        function drawCircle(center, radius, color, alpha, lw=lineWidth) {
            if(!isFinite(center.re) || !isFinite(center.im) || !isFinite(radius) || radius < 1e-8) return;
            let c = worldToCanvas(center);
            let radX = radius / (xlim[1]-xlim[0]) * width;
            if(radX > 800) return;
            ctx.save();
            ctx.globalAlpha = Math.min(1, Math.max(0.04, alpha));
            ctx.beginPath();
            ctx.arc(c.x, c.y, radX, 0, 2*Math.PI);
            ctx.strokeStyle = color;
            ctx.lineWidth = lw;
            ctx.stroke();
            ctx.restore();
        }
        
        function drawOrbit(seed, forward=true, maxIter=n_iter) {
            let mat = mobius;
            let inv = mobiusInverse(mat.a, mat.b, mat.c, mat.d);
            let current = seed;
            let color = forward ? fwdColor : bwdColor;
            for(let i=0; i<maxIter; i++) {
                let next = transformCircle(current, mat.a, mat.b, mat.c, mat.d);
                if(!next) break;
                let t = i/(maxIter);
                let alpha = Math.max(alphaMin, 1.0 - t*0.9);
                drawCircle(next.center, next.radius, color, alpha);
                current = next;
                if(!forward) {
                    // backward uses inverse matrix
                    let invNext = transformCircle(current, inv.a, inv.b, inv.c, inv.d);
                    if(!invNext) break;
                    current = invNext;
                }
            }
        }
        
        function drawAll() {
            ctx.clearRect(0,0,width,height);
            ctx.fillStyle = "#03050a";
            ctx.fillRect(0,0,width,height);
            // draw seeds base circles
            for(let s of seeds) {
                drawCircle(s.center, s.radius, seedColor, 1.0, lineWidth*1.2);
            }
            // forward and backward orbits
            for(let s of seeds) {
                let curFwd = s;
                for(let i=0; i<n_iter; i++) {
                    let next = transformCircle(curFwd, mobius.a, mobius.b, mobius.c, mobius.d);
                    if(!next) break;
                    let alpha = Math.max(alphaMin, 1.0 - (i/(n_iter))*0.85);
                    drawCircle(next.center, next.radius, fwdColor, alpha);
                    curFwd = next;
                }
                let inv = mobiusInverse(mobius.a, mobius.b, mobius.c, mobius.d);
                let curBwd = s;
                for(let i=0; i<n_iter; i++) {
                    let next = transformCircle(curBwd, inv.a, inv.b, inv.c, inv.d);
                    if(!next) break;
                    let alpha = Math.max(alphaMin, 1.0 - (i/(n_iter))*0.85);
                    drawCircle(next.center, next.radius, bwdColor, alpha);
                    curBwd = next;
                }
            }
        }
        
        function redrawFull() {
            drawAll();
            updateSeedListUI();
        }
        
        // add seed by click (canvas coordinates -> world)
        function addSeedFromClick(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const canvasX = (clientX - rect.left) * scaleX;
            const canvasY = (clientY - rect.top) * scaleY;
            let worldX = xlim[0] + (canvasX/width)*(xlim[1]-xlim[0]);
            let worldY = ylim[1] - (canvasY/height)*(ylim[1]-ylim[0]);
            let radius = 0.22;
            seeds.push({center:{re:worldX, im:worldY}, radius});
            redrawFull();
        }
        
        function updateSeedListUI() {
            const container = document.getElementById('seedList');
            container.innerHTML = '';
            seeds.forEach((s, idx) => {
                const div = document.createElement('div');
                div.style.display='flex'; div.style.justifyContent='space-between'; div.style.alignItems='center';
                div.style.padding='4px'; div.style.borderBottom='1px solid #252a44';
                div.innerHTML = `<span style="font-family:monospace;">📌 (${s.center.re.toFixed(2)},${s.center.im.toFixed(2)}) r=${s.radius.toFixed(2)}</span>
                                 <button data-idx="${idx}" class="delSeedBtn" style="background:#3a1f2c; padding:2px 8px;">✖</button>`;
                container.appendChild(div);
            });
            document.querySelectorAll('.delSeedBtn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    let idx = parseInt(btn.getAttribute('data-idx'));
                    seeds.splice(idx,1);
                    redrawFull();
                });
            });
        }
        
        // Animation step iteration growth
        let stepIterInterval = null;
        function startPlay() {
            if(animationId) clearInterval(animationId);
            playing = true;
            let delta = parseInt(document.getElementById('deltaMs').value);
            animationId = setInterval(() => {
                if(n_iter < maxIterLimit) {
                    n_iter = Math.min(maxIterLimit, n_iter+1);
                    document.getElementById('iterCount').value = n_iter;
                    document.getElementById('iterVal').innerText = n_iter;
                    redrawFull();
                } else {
                    if(playing) stopPlay();
                }
            }, delta);
        }
        function stopPlay() {
            if(animationId) { clearInterval(animationId); animationId=null; }
            playing = false;
        }
        function stepOnce() {
            if(playing) stopPlay();
            if(n_iter < maxIterLimit) {
                n_iter = Math.min(maxIterLimit, n_iter+1);
                document.getElementById('iterCount').value = n_iter;
                document.getElementById('iterVal').innerText = n_iter;
                redrawFull();
            }
        }
        function resetCanvas() {
            stopPlay();
            n_iter = parseInt(document.getElementById('iterCount').value);
            redrawFull();
        }
        
        // event binding
        function bindEvents() {
            document.getElementById('a_re').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('a_im').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('b_re').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('b_im').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('c_re').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('c_im').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('d_re').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('d_im').addEventListener('input', ()=>{updateMatrixFromSliders(); redrawFull();});
            document.getElementById('iterCount').addEventListener('input', (e)=>{ n_iter = parseInt(e.target.value); document.getElementById('iterVal').innerText=n_iter; if(!playing) redrawFull();});
            document.getElementById('alphaMin').addEventListener('input', (e)=>{ alphaMin = parseFloat(e.target.value); document.getElementById('alphaMinVal').innerText=alphaMin.toFixed(2); redrawFull();});
            document.getElementById('playBtn').onclick = ()=>{ if(playing) stopPlay(); else startPlay(); };
            document.getElementById('stepBtn').onclick = ()=>{ stepOnce(); };
            document.getElementById('resetCanvasBtn').onclick = ()=>{ resetCanvas(); };
            document.getElementById('clearSeedsBtn').onclick = ()=>{ seeds = []; redrawFull(); };
            document.getElementById('defaultSeedsBtn').onclick = ()=>{ seeds = [{center:{re:0.3,im:0.3},radius:0.25},{center:{re:-0.5,im:0.8},radius:0.2},{center:{re:1.0,im:-0.3},radius:0.3},{center:{re:-0.2,im:-0.6},radius:0.22}]; redrawFull(); };
            document.getElementById('applyTypeBtn').onclick = ()=>{ let sel = document.getElementById('transformType').value; if(sel!=='custom') applyPreset(sel); };
            document.getElementById('deltaMs').addEventListener('input', (e)=>{ document.getElementById('deltaVal').innerText=e.target.value+'ms'; if(playing){ stopPlay(); startPlay(); } });
            canvas.addEventListener('click', (e) => { addSeedFromClick(e.clientX, e.clientY); });
        }
        
        function init() {
            updateMatrixFromSliders();
            bindEvents();
            redrawFull();
            updateSeedListUI();
        }
        init();
    })();
</script>
</body>
</html>
